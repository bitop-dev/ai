    parallel_group: 1
    tags: [phase-0, structure]
    file: phase-0.md
    acceptance_criteria:
      - Top-level layout documented (cmd, internal, pkg, examples, docs)
      - Public vs internal package rules stated
      - Naming conventions and import paths listed
      - decision rationale in tasks directory documented in phase-decision-0.md doc

  - title: "phase-0.md - Map TS packages to Go packages and note exclusions"
