    parallel_group: 1
    tags: [phase-0, mapping]
    file: phase-0.md
    acceptance_criteria:
      - Each ai-sdk-6 package mapped to a Go package or noted as not ported
      - Non-ported packages list replacement approach
      - Mapping validated against ai-sdk-6/packages inventory
      - decision rationale in tasks directory documented in phase-decision-0.md doc

  - title: "phase-0.md - Decide module layout and module path"
    completed: true
    parallel_group: 1
    tags: [phase-0, module]
    file: phase-0.md
    acceptance_criteria:
      - Single vs multi-module decision recorded
      - Module path chosen and documented
      - Public package boundaries aligned with module decision
      - decision rationale in tasks directory documented in phase-decision-0.md doc

